# doc-dev: docs/ci/04-release.md
name: Bot Bump Orbit Version
# Optional convenience for release step ①: a hand-opened PR editing setup.py's
# version line (via .github/scripts/release/bump_orbit_version.py) is fully equivalent
# and triggers CI normally.

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'Base Orbit version (X.Y.Z only; e.g., 0.3.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    if: github.repository == 'Sphere-AI-Lab/orbit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Bump version and open PR
        # GITHUB_TOKEN-created PRs do not trigger pr-test.yml; close/reopen the
        # PR once to run CI, or switch this to a PAT secret later.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ github.event.inputs.new_version }}"
          git config user.name "orbit-bot"
          git config user.email "orbit-bot@users.noreply.github.com"
          BRANCH_NAME="bot/bump-orbit-version-${NEW_VERSION}-$(echo $RANDOM | md5sum | head -c 4)"
          git checkout -b "$BRANCH_NAME"
          python .github/scripts/release/bump_orbit_version.py "$NEW_VERSION"
          git add setup.py
          git commit -m "release: bump orbit version to ${NEW_VERSION}"
          git push origin "$BRANCH_NAME"
          gh pr create \
            --title "release: bump orbit version to ${NEW_VERSION}" \
            --body "Automated version bump via bot-bump-orbit-version.yml." \
            --base main --head "$BRANCH_NAME"
