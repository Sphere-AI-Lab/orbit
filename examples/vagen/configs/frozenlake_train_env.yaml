# FrozenLake train EnvSpec — strict mirror of VAGEN main's
# train_frozenlake_vision.yaml. Unset env knobs fall back to
# FrozenLakeEnvConfig defaults (prompt_format=free_think, format_reward=0.02,
# success_reward=1.0, use_example_in_sys_prompt=True, action_sep=",") —
# matching VAGEN main exactly. See examples/vagen/docs/dataset.md.
envs:
  - name: FrozenLake
    n_envs: 10000
    seed: [1, 10000, 1]
    max_turns: 5
    response_length_per_turn: 512
    config:
      render_mode: vision
      size: 4
      p: 0.8
      is_slippery: false
      slip_prob: 0.0
      max_actions_per_step: 5
