[build-system]
requires = [
    "packaging",
    "setuptools >= 49.4.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "orbit"
version = "0.2.1"
description = "Orbit RL infrastructure for large-scale post-training"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Orbit Team" },
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "accelerate==1.13.0",
    "blobfile==3.0.0",
    "cachetools==7.1.1",
    "datasets==4.8.5",
    "deep-ep",
    "fsspec==2026.2.0",
    "func_timeout==4.3.5",
    "httpx[http2]==0.28.1",
    "mcp[cli]==1.27.1",
    "megatron-bridge",
    "megatron-core",
    "memray",
    "nvidia-resiliency-ext",
    "omegaconf==2.3.0",
    "pillow==12.2.0",
    "pybase64==1.4.3",
    "pylatexenc==2.10",
    "pytest-asyncio",
    "pyyaml==6.0.3",
    "qwen_vl_utils==0.0.14",
    "ray[default]==2.55.1",
    "ring_flash_attn",
    "sglang",
    "sglang-router==0.3.2",
    "starlette==0.52.1",
    "tensorboard==2.20.0",
    "timm==1.0.16",
    "transformer-engine",
    "transformers==5.12.1",
    "wandb==0.27.0",
]

[project.optional-dependencies]
fsdp = [
    "torch==2.11.0",
]
# Only tools/lora_regret/plot.py needs this, and it imports lazily so the
# module stays importable without it.
plots = [
    "matplotlib>=3.8",
]
# Opt-in one-shot install: `uv sync --extra allinone` (with `source env.sh`) builds
# the full CUDA-13 kernel + ML layer that CUDA-13-install.md otherwise installs by
# hand, so no manual layer is needed. Default `uv sync` is unchanged by this extra.
# Build sources/flags for these live in [tool.uv.sources], no-build-isolation-package,
# and [tool.uv.extra-build-dependencies] below. (numpy<2 is pinned globally in
# [tool.uv] override-dependencies because orbit/Megatron require numpy 1.x regardless.)
allinone = [
    # CUDA kernels — source-built against the pinned torch 2.11 / CUDA 13 layer.
    "flash-attn==2.8.3",
    "mamba-ssm==2.3.1",
    "causal-conv1d==1.6.2.post1",
    "flash-linear-attention==0.5.0",
    "fast-hadamard-transform",
    "deep-gemm-official",
    "sglang-kernel==0.4.5",
    # PyPI wheel, not a source build: sglang on the v0.5.16 line needs
    # >=0.0.9.post1, and upstream's 0.0.9.post1 is exactly the release that ships
    # cu12 and cu13 .so variants in one abi3 wheel and probes torch.version.cuda
    # at runtime. Building that rev from source instead demands TMS_CUDA_MAJOR
    # (see scripts/build_multi_cuda.sh) and fails without it, so the git source /
    # no-build-isolation entries for this package were dropped.
    "torch-memory-saver==0.0.9.post1",
    "apex",
    # 0.1.11, not 0.1.9: sglang on the v0.5.16 line requires ==0.1.11, and uv will
    # not resolve otherwise. The libcudart stub fix-up in
    # examples/load_cuda13_2_orbit_env.sh derives its path from the installed
    # package, so it does not care which of the two is present.
    "tilelang==0.1.11",
    "tile-kernels==1.0.0",
    # ML libs (CUDA-13-install.md steps 6/11)
    "open-clip-torch==3.3.0",
    "trl",
    "math-verify==0.9.0",
    "latex2sympy2-extended==1.11.0",
    "liger-kernel==0.8.0",
    "ftfy",
    "nvtx",
    # megatron.bridge imports modelopt at module load (the manual path gets it via the
    # NVIDIA-NeMo Megatron-Bridge priming step).
    "nvidia-modelopt==0.44.0",
    # build-time tools for the no-build-isolation source builds
    "ninja",
    "pybind11",
    "cmake>=3.31",
    "scikit-build-core",
]

[tool.uv]
# Keep transitive packages from silently selecting an untested CUDA/Torch build.
override-dependencies = [
    # Match the tested SGLang CUDA 13 stack. Current Megatron-Core does not cap NumPy to 1.x.
    "numpy==2.3.5",
    "cuda-python==13.2.0",
    # Keep the Python package aligned with the cu130 cubin and JIT-cache artifacts.
    "flashinfer-python==0.6.15.post1",
    "megatron-core",
    "nvidia-cublas==13.4.1.1",
    "nvidia-cuda-cupti==13.2.75",
    "nvidia-cuda-nvrtc==13.2.78",
    "nvidia-cuda-runtime==13.2.75",
    "nvidia-cudnn-cu13==9.22.0.52",
    "nvidia-cufft==12.2.0.46",
    "nvidia-curand==10.4.2.55",
    "nvidia-cusolver==12.2.0.1",
    "nvidia-cusparse==12.7.10.1",
    "nvidia-nccl-cu13==2.30.4",
    "nvidia-nvjitlink==13.2.78",
    "nvidia-nvtx==13.2.75",
    "timm==1.0.16",
    "transformers==5.12.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "triton==3.6.0",
]
no-build-isolation-package = [
    "causal-conv1d",
    "deep-ep",
    "deep-gemm-official",
    "fast-hadamard-transform",
    "flash-attn",
    "flash-linear-attention",
    "mamba-ssm",
    "sglang-kernel",
    "transformer-engine",
    "transformer-engine-torch",
]

[tool.uv.extra-build-dependencies]
transformer-engine = ["pybind11", "setuptools", "torch", "wheel"]
fast-hadamard-transform = ["setuptools", "torch", "wheel", "packaging"]
flash-attn = ["setuptools", "torch", "wheel", "packaging", "psutil", "ninja"]
mamba-ssm = ["setuptools", "torch", "wheel", "packaging", "ninja"]
causal-conv1d = ["setuptools", "torch", "wheel", "packaging", "ninja"]
deep-gemm-official = ["setuptools", "torch", "wheel", "packaging"]
deep-ep = ["setuptools", "torch", "wheel", "packaging"]
sglang-kernel = ["setuptools", "torch", "wheel", "scikit-build-core", "cmake", "ninja"]
flash-linear-attention = ["setuptools", "torch", "wheel"]

[tool.uv.sources]
deep-ep = { git = "https://github.com/deepseek-ai/DeepEP.git", rev = "d4f41e4e93602a15e95f55f6ee8df8f1aaa0e4bb" }
megatron-bridge = { git = "https://github.com/Sphere-AI-Lab/Megatron-Bridge.git", rev = "69a8e369e23f522c354f1cd33c2cfd21ef5768d6" }
megatron-core = { git = "https://github.com/Sphere-AI-Lab/Megatron-LM.git", rev = "00eb75b0c803b0fc8e5413d736529d9d3b82b6bd" }
nvidia-resiliency-ext = { git = "https://github.com/NVIDIA/nvidia-resiliency-ext.git", rev = "63154570cea17f8805a7fd15cc3b8cc2919ba575" }
# orbit-main-oft-tiny = sglang's orbit-main (v0.5.16 + the modularized OFT/LoRA
# single-active peft framework) with the tiny-block OFT work ported on top. The
# tiny-block series previously rode the v0.5.9 line (9c83ae8be + 48 commits);
# it moved here because orbit's own peft transport speaks the v0.5.16 unified
# peft_method/adapter_* wire API, which the v0.5.9 line does not have.
#
# The kernel package tracks the SAME rev now, and is RENAMED: the sgl-kernel/
# subdirectory publishes `sgl-kernel` 0.3.21 on the v0.5.9 line but
# `sglang-kernel` 0.4.5 here, so the dependency name had to change with the pin
# (uv errors with "metadata name `sglang-kernel` does not match given name
# `sgl-kernel`" otherwise). The subdirectory= path is still sgl-kernel.
#
# It no longer lags sglang either. On the v0.5.9 line the two could diverge
# because that subdirectory's tree was identical across the range, which kept the
# 852 MB compiled extension cached across syncs. Across the v0.5.9 -> v0.5.16
# move the tree genuinely differs, so pairing new Python with old kernels would
# be an ABI mismatch. Expect one rebuild.
#
# What this range buys, and must not be given back:
#
# * Power-of-two OFT blocks from 4 through 1024, BS16+ on the tensor-core dot
#   paths, QKV BS4/8 defaulting to the measured legacy path.
# * Tiled OFT rotations above 128, for BOTH the fused QKV/gate_up kernel and the
#   un-fused `gemm_oft_r`/`sgemm_oft_r` pair that `o_proj`/`down_proj` take. The
#   fused kernel alone is not enough: an OFT arm with --target all reaches
#   gemm_oft_r on every layer and dies with `OutOfResources ... Required:
#   2228224` several minutes into a rollout.
# * A streamed-load chunk limit accounted in EXPANDED bytes. Accounting it in
#   COMPACT bytes understates the real allocation (expanded full blocks plus
#   Cayley intermediates, ~10x) and row-parallel groups bypassed the limit
#   entirely -- every OFT adapter update then transiently took 7-9 GB. Colocated
#   with a paused ~20 GB KV arena whose resume runs immediately after, that OOM'd
#   in torch_memory_saver's cuMemCreate on the 4th rollout. Measured on
#   2026-08-03: 8.8 GB per update before, 0.6 GB after, 10/10 rollouts clean.
#
# Moved 05cd76b4d -> 51845dc4a (2026-08-20) so the manifest names the build that
# was actually validated. The numerical-equivalence report's reproducibility
# block records `orbit_env_v2` as "05cd76b4d + fixes 40784883e, 51845dc4a
# deployed": every Stage A/B verdict was measured on an env that already carried
# both fixes on top of the old pin, but a fresh `uv sync` against that pin did
# NOT reproduce it. The two fixes are the whole reason to move:
#
# * 40784883e -- propagate resolved adapter ids into cached request sub-objects.
#   Without it a disk-loaded OFT adapter silently served BASE-model weights, so
#   an eval that read like a trained-adapter number was not one.
# * 51845dc4a -- key the radix cache by OFT adapter id. Without it a cached
#   prefix from one adapter can be reused for another (the `extra_key`
#   contamination path). RL is protected by its rollout shape; serving is not.
#
# The other three commits in the range (2406bf248, 4ca61eea9, a5def08d0) are test
# repointing and a chore -- no kernel change. That is why the older note in
# scripts/lora_regret/env_v0516.sh calls the gap equivalent: it was written when
# the tip was a5def08d0, and it is no longer true of the current tip.
sglang = { git = "https://github.com/Sphere-AI-Lab/sglang.git", rev = "51845dc4acca94507ab184b007c8fcfd656b191f", subdirectory = "python" }
# TransformerEngine built from source (verified end-to-end). The orbit-build-wheels
# prebuilt is cu13/torch-2.11-correct too, but swapping it in perturbed libcudart load
# order and exposed a flaky tilelang<->flashinfer find_loaded_library("libcudart")
# race (tilelang's libcudart_stub.so shadows the real lib). Keep source build until
# that orbit/tilelang issue is fixed.
# (Prebuilt alt: { url = "https://github.com/liulixinkerry/orbit-build-wheels/releases/download/cu132-torch211-ubuntu2204/transformer_engine-2.14.0-cp312-cp312-linux_x86_64.whl" })
transformer-engine = { git = "https://github.com/NVIDIA/TransformerEngine.git", rev = "71bbefbf153418f943640df0f7373625dc93fa46" }
fast-hadamard-transform = { git = "https://github.com/Dao-AILab/fast-hadamard-transform.git", rev = "e7706faf8d1c3b9f241e36860640ad1dac644ede" }
deep-gemm-official = { git = "https://github.com/liulixinkerry/DeepGEMM.git", rev = "18db30e9db9703b906e9ab3803fbbc1a64be1520" }
sglang-kernel = { git = "https://github.com/Sphere-AI-Lab/sglang.git", rev = "51845dc4acca94507ab184b007c8fcfd656b191f", subdirectory = "sgl-kernel" }
sglang-router = { url = "https://github.com/zhuzilin/sgl-router/releases/download/v0.3.2-5f8d397/sglang_router-0.3.2-cp38-abi3-manylinux_2_28_x86_64.whl" }
# apex orbit-build-wheels prebuilt is cu13-clean; source build needs fragile --config-settings, so use the public wheel.
apex = { url = "https://github.com/liulixinkerry/orbit-build-wheels/releases/download/cu132-torch211-ubuntu2204/apex-0.1-cp312-cp312-linux_x86_64.whl" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "orbit*",
    "orbit_plugins*",
    "tools*",
]

[tool.orbit.release.backend-pins.megatron-core]
source = "https://github.com/Sphere-AI-Lab/Megatron-LM.git"
tested-ref = "00eb75b0c803b0fc8e5413d736529d9d3b82b6bd"

[tool.orbit.release.backend-pins.megatron-bridge]
source = "https://github.com/Sphere-AI-Lab/Megatron-Bridge.git"
tested-ref = "69a8e369e23f522c354f1cd33c2cfd21ef5768d6"

[tool.orbit.release.backend-pins.sglang]
source = "https://github.com/Sphere-AI-Lab/sglang.git"
subdirectory = "python"
tested-ref = "51845dc4acca94507ab184b007c8fcfd656b191f"

[tool.isort]
profile = "black"  # black-compatible
line_length = 119  # should match black parameters
ignore_whitespace = true  # ignore whitespace for compatibility with the initial style
py_version = 310  # python 3.10 as a target version
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
extend_skip = ["setup.py"]
known_first_party = ["orbit", "orbit_plugins"]
known_third_party = ["megatron", "wandb", "ray", "transformers"]
src_paths = ["orbit", "orbit_plugins"]


[tool.black]
line_length = 119

[tool.ruff]
line-length = 320  # Follow-up
select = [
    "E",      # Pycodestyle Errors (Structural/Fundamental Errors like bad indentation)
    "F",      # Pyflakes (Core Errors: Unused imports, undefined names)
    "B",      # Flake8-Bugbear (Logic Bugs: Variable shadowing, dangerous default arguments)
    "UP",     # pyupgrade (Modernization and compatibility issues)
]
ignore = [
    "E402", # module-import-not-at-top-of-file
    "E501", # Line too long # Follow-up handle it later
]

[tool.pytest.ini_options]
# durations=0 will display all tests execution time, sorted in ascending order starting from from the slowest one.
# -vv will also display tests with duration = 0.00s
addopts = "--verbose --pyargs --durations=0 --strict-markers"  # always add these arguments to pytest
testpaths = ["./tests"]  # must be an explicit path to avoid importing another "tests" module
# directories to ignore when discovering tests
norecursedirs = [
    "external",
    "examples",
    "docs",
    "scripts",
    "tools",
    "tutorials",
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "venv",
    "{arch}",
]
asyncio_mode = "auto"
# NOTE: we do not use pytest markers currently. tests are mainly separated by folders, i.e. tests/fast vs tests/e2e
