# Envpack FrozenLake train EnvSpec.
# Mirrors the VAGEN-main FrozenLake vision recipe.
envs:
  - name: FrozenLake
    n_envs: 10000
    seed: [1, 10000, 1]
    profile: vision_free_think_local
    pool_id: frozenlake-vision
    config:
      render_mode: vision
      size: 4
      p: 0.8
      is_slippery: false
      slip_prob: 0.0
      max_actions_per_step: 5
