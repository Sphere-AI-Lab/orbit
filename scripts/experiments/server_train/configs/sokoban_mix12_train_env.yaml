# Envpack Sokoban MIXED 1box+2box train EnvSpec (6x6, min_solve_steps [1,10]).
#
# Mixed-family experiment. Two env specs (1 box, 2 boxes) are built
# independently by the Sokoban builder and concatenated. With allocation: full,
# total_train is ignored and final train/eval size depends on each family's
# discovered unique in-range puzzle supply. bucket_prefix keeps the two box
# counts in separate metric buckets (6x6_b1_solve_X / 6x6_b2_solve_X).
#
# allocation: full keeps every de-duplicated puzzle in the requested solve range
# for each family, then concatenates the families. Inspect capacity_report.json
# for bucket_available, bucket_train_counts, and bucket_eval_counts before
# launching a long run.
#
# `total_train` is kept only for schema compatibility; allocation: full ignores it.
envs:
  - name: Sokoban
    n_envs: 50000
    seed: [1, 50000, 1]
    profile: vision_free_think_local
    pool_id: sokoban-vision
    bucket_prefix: 6x6_b1
    config:
      render_mode: vision
      sokoban_render_style: sprite
      tiny_scale: 16
      raw_plane_scale: 16
      prompt_format: free_think
      dim_room: [6, 6]
      num_boxes: 1
      max_steps: 100
      max_actions_per_step: 3
      min_solution_bfs_max_depth: 200
  - name: Sokoban
    n_envs: 50000
    seed: [1, 50000, 1]
    profile: vision_free_think_local
    pool_id: sokoban-vision
    bucket_prefix: 6x6_b2
    config:
      render_mode: vision
      sokoban_render_style: sprite
      tiny_scale: 16
      raw_plane_scale: 16
      prompt_format: free_think
      dim_room: [6, 6]
      num_boxes: 2
      max_steps: 100
      max_actions_per_step: 3
      min_solution_bfs_max_depth: 200
sampling:
  # Kept for schema compatibility; allocation: full ignores total_train.
  total_train: 3000
  validation_ratio: 0.05
  preserve_validation_bucket_proportions: true
  min_solve_steps: [1, 10]
  allocation: full
  sampling_policy: best_effort
  probe_concurrency: 32
